<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Gorilla</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1026" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <!-- Todo el overlay deja pasar el puntero salvo los botones: asi se puede
         tensar el tiro arrastrando desde cualquier punto de la pantalla. -->
    <div id="overlay">
      <header id="topbar">
        <div class="score" data-player="0">
          <b id="scoreA">0</b><span id="nameA">JUGADOR 1</span>
        </div>
        <div class="middle">
          <button type="button" id="assist" class="chip" title="Ayuda de mira">••</button>
          <div class="wind" id="windPill"><span id="windArrow">→</span><b id="windValue">0.0</b></div>
          <button type="button" id="mute" class="chip" title="Sonido">🔊</button>
        </div>
        <div class="score" data-player="1">
          <b id="scoreB">0</b><span id="nameB">JUGADOR 2</span>
        </div>
      </header>

      <!-- Solo con ?diag=1: dice que canales de respuesta hay vivos en ESTE
           aparato, que es la unica forma de diagnosticar la vibracion sin
           tenerlo en la mano. -->
      <pre id="diag" hidden></pre>

      <!-- Control 100% tactil: no hay un solo boton. Se tensa arrastrando, se
           lanza al soltar y se cancela tocando con un segundo dedo. Los
           indicadores de angulo y potencia los pinta el canvas arriba, donde no
           los tapa la mano. -->
      <div id="banner" hidden></div>

      <!-- La franja de abajo es zona de tiro: esta banda queda excluida del
           gesto (ver `footerTop` en viewport.ts) para que lo pulsable se pueda
           tocar sin robarle arrastres al juego. -->
      <footer id="footer">
        <span id="version"></span>
        <button type="button" id="coffee" data-i18n="coffee">☕ Invítame a un café</button>
        <button type="button" id="langToggle" class="chip">
          <span data-lang="es">ES</span><i>·</i><span data-lang="en">EN</span>
        </button>
      </footer>
    </div>

    <!-- Ko-fi, como en gasolineras. Manda cabeceras que impiden incrustarlo en
         un iframe, asi que este dialogo confirma antes de abrir otra pestana:
         un toque accidental en el pie no puede sacarte de la partida. -->
    <div id="coffeeDialog" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="coffeeTitle">
        <h2 id="coffeeTitle" data-i18n="coffeeTitle">¿Un café?</h2>
        <p data-i18n="coffeeBody"></p>
        <p class="note" data-i18n="coffeeNote"></p>
        <a
          id="coffeeOpen"
          href="https://ko-fi.com/davic"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="coffeeOpen"
          >Abrir Ko-fi</a
        >
        <button type="button" id="coffeeLater" data-i18n="coffeeLater">Ahora no</button>
      </div>
    </div>

    <!-- La arena esta disenada en vertical: en apaisado no cabe la parabola y
         la ciudad se aplasta. Antes que degradar el juego, se pide girar. -->
    <div id="rotate">
      <span>📱</span>
      <b data-i18n="rotate">Gira el móvil</b>
      <small data-i18n="rotateHint">Gorilla se juega en vertical</small>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
