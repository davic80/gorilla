# Sitio estático detrás del Caddy compartido, que es quien termina TLS. Aquí
# solo hace falta servir ficheros bien cacheados.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy ya añade las cabeceras de seguridad de cara al exterior; estas
    # cubren el caso de acceder al contenedor directamente.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los assets llevan hash en el nombre: son inmutables y se pueden cachear
    # para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html NO se cachea: es lo que apunta a la versión nueva de los
    # assets, y cachearlo dejaría a la gente con el bundle viejo tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # La semilla de partida viaja en el fragmento (#seed=...), que ni siquiera
    # llega al servidor. El fallback cubre rutas escritas a mano.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
